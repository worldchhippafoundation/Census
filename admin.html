<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyDnhy28IGzf_xLULYBJuiO9HHRz0bIZ0gA",
  authDomain: "chhippa-census.firebaseapp.com",
  projectId: "chhippa-census",
  storageBucket: "chhippa-census.firebasestorage.app",
  messagingSenderId: "285949399557",
  appId: "1:285949399557:web:45bdb5ff288fdec0d3026c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.__auth = auth;
window.__db = db;
window.currentAdmin = null;
window.allRecords = {};

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const userEmailEl = document.getElementById('currentUserEmail');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';
  loginError.classList.add('hidden');
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const submitBtn = loginForm.querySelector('button[type="submit"]');
  const origText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in...';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById('adminPassword').value = '';
  } catch (err) {
    loginError.textContent = "Login failed: " + err.message;
    loginError.classList.remove('hidden');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = origText;
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginScreen.classList.add('hidden');
    dashboard.classList.remove('hidden');
    userEmailEl.textContent = user.email;
    window.currentAdmin = user;
    refreshFromCloud();
  } else {
    loginScreen.classList.remove('hidden');
    dashboard.classList.add('hidden');
    window.currentAdmin = null;
  }
});

window.logoutAdmin = function() { signOut(auth); };

window.refreshFromCloud = async function() {
  const statusEl = document.getElementById('dbStatus');
  const dotEl = document.getElementById('dbStatusDot');
  statusEl.textContent = 'Loading from Firebase...';
  dotEl.className = 'w-3 h-3 rounded-full bg-amber-400 animate-pulse';

  try {
    const [censusSnap, trialSnap, pendingSnap] = await Promise.all([
      getDocs(collection(db, 'census_registrations')),
      getDocs(collection(db, 'trial_census_registrations')),
      getDocs(collection(db, 'wcf_pending_queue'))
    ]);

    const merged = {};
    trialSnap.forEach(d => { const r = d.data(); if (r && r.code) merged[r.code] = r; });
    censusSnap.forEach(d => { const r = d.data(); if (r && r.code) merged[r.code] = r; });
    pendingSnap.forEach(d => {
      const r = d.data();
      if (r && r.isEventGreetingConfig) return;
      if (r && r.code) merged[r.code] = r;
    });

    window.allRecords = merged;
    statusEl.textContent = `Connected — ${Object.keys(merged).length} records loaded`;
    dotEl.className = 'w-3 h-3 rounded-full bg-emerald-500';
    renderStats();
    renderPendingQueue();
    loadEventGreetingConfig();
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
    dotEl.className = 'w-3 h-3 rounded-full bg-red-500';
  }
};

function isApproved(rec) { return rec && rec.status === 'Approved' && rec.code && !String(rec.code).startsWith('PEND-'); }

function renderStats() {
  const all = Object.values(window.allRecords);
  const approved = all.filter(isApproved);
  const families = approved.filter(r => r.type === 'family').length;
  const individuals = approved.reduce((sum, r) => sum + 1 + (Array.isArray(r.members) ? r.members.length : 0), 0);
  const pending = all.filter(r => r.status === 'Pending Verification' || r.status === 'Possible Duplicate').length;

  document.getElementById('statFamilies').textContent = families;
  document.getElementById('statIndividuals').textContent = individuals;
  document.getElementById('statPending').textContent = pending;
}

function renderPendingQueue() {
  const container = document.getElementById('pendingQueue');
  const pending = Object.values(window.allRecords).filter(r => r.status === 'Pending Verification' || r.status === 'Possible Duplicate');

  if (pending.length === 0) {
    container.innerHTML = '<p class="text-slate-400 italic text-xs p-3">✅ No pending applications.</p>';
    return;
  }

  container.innerHTML = pending.map(rec => `
    <div class="p-3 bg-white border border-amber-300 rounded-lg flex flex-col sm:flex-row justify-between gap-2 shadow-sm">
      <div class="space-y-1 text-xs">
        <div class="flex items-center gap-2 flex-wrap">
          <strong class="text-slate-900">${escapeHtml(rec.head?.name || 'Unknown')}</strong>
          <span class="font-mono bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded border border-amber-300">${escapeHtml(rec.code || '—')}</span>
        </div>
        <div class="text-slate-600">Father: ${escapeHtml(rec.head?.father || '—')} | Clan: <b class="text-red-700">${escapeHtml(rec.head?.clan || 'Other')}</b></div>
        <div class="text-slate-500 font-mono text-[11px]">📞 ${escapeHtml(rec.head?.phone || '—')} | 📍 ${escapeHtml(rec.head?.city || '—')}, ${escapeHtml(rec.head?.country || '—')}</div>
      </div>
      <div class="flex gap-2 shrink-0 self-center">
        <button onclick="approveRecord('${escapeHtml(rec.code)}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold shadow">✓ Approve</button>
        <button onclick="rejectRecord('${escapeHtml(rec.code)}')" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold shadow">✕ Reject</button>
      </div>
    </div>
  `).join('');
}

window.approveRecord = async function(code) {
  const rec = window.allRecords[code];
  if (!rec) return;
  if (!confirm(`Approve ${rec.head?.name}?`)) return;

  try {
    let finalCode = code;
    if (String(code).startsWith('PEND-')) {
      const prefix = rec.type === 'individual' ? 'IIC-' : 'WCF-';
      do { finalCode = prefix + Math.floor(100000 + Math.random() * 900000); } while (window.allRecords[finalCode]);
    }
    const updated = { ...rec };
    updated.code = finalCode;
    updated.status = 'Approved';
    if (updated.head && (!updated.head.memberId || updated.head.memberId === 'PENDING')) {
      updated.head.memberId = 'WCF-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    }
    await setDoc(doc(db, 'census_registrations', finalCode), updated);
    await deleteDoc(doc(db, 'wcf_pending_queue', code)).catch(() => {});
    await deleteDoc(doc(db, 'trial_census_registrations', code)).catch(() => {});
    alert(`✅ Approved! Code: ${finalCode}`);
    await refreshFromCloud();
  } catch (err) { alert('Error: ' + err.message); }
};

window.rejectRecord = async function(code) {
  if (!confirm(`Reject record?`)) return;
  try {
    await deleteDoc(doc(db, 'wcf_pending_queue', code)).catch(() => {});
    await deleteDoc(doc(db, 'trial_census_registrations', code)).catch(() => {});
    alert(`✕ Rejected.`);
    await refreshFromCloud();
  } catch (err) { alert('Error: ' + err.message); }
};

// ================= PDF EXPORTS WITH FILTERS =================
function getEnglishValue(type, key) {
  if (!key) return '-';
  const dict = { relation: { Wife: 'Wife', Husband: 'Husband', Son: 'Son', Daughter: 'Daughter', Father: 'Father', Mother: 'Mother', Brother: 'Brother', Sister: 'Sister', Other: 'Other' }, gender: { Male: 'Male', Female: 'Female', Other: 'Other' }, education: { Matric: 'Matriculation (10th)', Intermediate: 'Intermediate (12th)', Graduate: 'Graduate (Bachelors)', Masters: 'Post Graduate (Masters)', Primary: 'Primary School', Religious: 'Islamic / Religious Scholar', Uneducated: 'Uneducated', Other: 'Other' }, job: { Business: 'Business', Textile: 'Textile', Tailor: 'Tailor', PrivateJob: 'Private Job', GovtJob: 'Government Job', Teacher: 'Teacher', Healthcare: 'Healthcare', EngineerIT: 'Engineer / IT', Driver: 'Driver', DailyWage: 'Daily Wage', Student: 'Student', Homemaker: 'Homemaker', Retired: 'Retired', Other: 'Other' }, clan: { Tak: 'Tak', Bhati: 'Bhati', Rao: 'Rao', Molani: 'Molani', Lodha: 'Lodha', Deora: 'Deora', Kukda: 'Kukda', Jinva: 'Jinva', Mangla: 'Mangla', Behlim: 'Behlim', Joiya: 'Joiya', Bhimpal: 'Bhimpal', Chauhan: 'Chauhan', Panwar: 'Panwar', Other: 'Other' } };
  return (dict[type] && dict[type][key]) ? dict[type][key] : key;
}

window.exportMasterPDF = function() {
  const approved = Object.values(window.allRecords).filter(isApproved);
  const countryFilter = document.getElementById('filterCountry').value.trim();
  const cityFilter = document.getElementById('filterCity').value.trim();
  const clanFilter = document.getElementById('filterClan').value.trim();

  let filtered = approved.filter(r => {
    if (countryFilter && !(r.head?.country || '').toLowerCase().includes(countryFilter.toLowerCase())) return false;
    if (cityFilter && !(r.head?.city || '').toLowerCase().includes(cityFilter.toLowerCase())) return false;
    if (clanFilter && (r.head?.clan || '') !== clanFilter) return false;
    return true;
  });

  if (filtered.length === 0) { alert('No records match the selected filters.'); return; }
  
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('l', 'mm', 'a4');
  doc.setFontSize(14);
  doc.text('World Chhippa Foundation — Master Census Directory', 14, 12);
  doc.setFontSize(8);
  doc.text(`Scope: [${countryFilter || 'All'}] [${cityFilter || 'All'}] [${clanFilter || 'All'}] | Total: ${filtered.length}`, 14, 18);

  let y = 28;
  doc.setFillColor(30, 41, 59); doc.rect(14, y - 4, 270, 7, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(7);
  doc.text('#', 16, y); doc.text('Code', 22, y); doc.text('Member ID', 50, y); doc.text('Name', 78, y);
  doc.text('Clan', 130, y); doc.text('Phone', 155, y); doc.text('City', 190, y); doc.text('Country', 225, y);
  doc.setFont('helvetica', 'normal'); doc.setTextColor(15, 23, 42); y += 6;

  let n = 1;
  filtered.forEach(r => {
    const persons = [{ name: r.head?.name || '—', memberId: r.head?.memberId || '—', clan: r.head?.clan || '—', phone: r.head?.phone || '—' }];
    (r.members || []).forEach(m => { persons.push({ name: m.name || '—', memberId: m.memberId || '—', clan: m.clan || r.head?.clan || '—', phone: m.phone || r.head?.phone || '—' }); });
    persons.forEach(p => {
      if (y > 195) { doc.addPage(); y = 15; }
      doc.setFontSize(7);
      doc.text(String(n), 16, y); doc.text(r.code || '—', 22, y); doc.text(p.memberId.substring(0, 14), 50, y);
      doc.text(p.name.substring(0, 30), 78, y); doc.text((p.clan || '—').substring(0, 14), 130, y);
      doc.text((p.phone || '—').substring(0, 18), 155, y); doc.text((r.head?.city || '—').substring(0, 18), 190, y); doc.text((r.head?.country || '—').substring(0, 18), 225, y);
      y += 5; n++;
    });
  });
  doc.save(`WCF_Master_${new Date().toISOString().slice(0, 10)}.pdf`);
};

window.exportAdultUnmarriedPDF = function() {
  const approved = Object.values(window.allRecords).filter(isApproved);
  const list = [];
  approved.forEach(rec => {
    (rec.members || []).forEach(m => {
      const isChild = (m.relationKey === 'Son' || m.relationKey === 'Daughter');
      const ageNum = parseInt(m.age) || 0;
      if (isChild && ageNum >= 18 && (m.maritalStatusKey === 'Unmarried' || !m.maritalStatusKey)) {
        list.push({ name: m.name, gender: getEnglishValue('gender', m.genderKey), dob: m.dob || '-', age: ageNum, edu: getEnglishValue('education', m.eduKey), job: getEnglishValue('job', m.jobKey), head: rec.head?.name, phone: rec.head?.phone });
      }
    });
  });
  if (list.length === 0) { alert('No 18+ unmarried members found.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');

  let y = 30;
  doc.setFont('helvetica', 'bold'); doc.setFillColor(243, 232, 255); doc.rect(14, y - 5, 182, 7, 'F');
  doc.text('#', 16, y); doc.text('Name', 24, y); doc.text('Gender', 60, y); doc.text('Age / DOB', 78, y); doc.text('Education / Job', 102, y); doc.text('Guardian', 140, y);
  doc.setFont('helvetica', 'normal'); y += 6;
  list.forEach((item, i) => {
    if (y > 280) { doc.addPage(); y = 20; }
    doc.setFontSize(8);
    doc.text(String(i + 1), 16, y); doc.text(item.name.substring(0, 20), 24, y); doc.text(item.gender, 60, y);

  doc.save(`WCF_Unmarried_${new Date().toISOString().slice(0, 10)}.pdf`);
};

window.exportJSONBackup = function() {
  const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(window.allRecords, null, 2));
  const a = document.createElement('a'); a.href = dataStr; a.download = `WCF_Backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
};

// ================= EVENT GREETING =================
window.loadEventGreetingConfig = async function() {
  try {
    const q = query(collection(db, 'wcf_config'), where('isEventGreetingConfig', '==', true));
    const snap = await getDocs(q);
    const badge = document.getElementById('eventBadge');
    if (snap.empty) { if (badge) { badge.textContent = '⚪ Not Active'; badge.className = 'text-xs font-bold px-3 py-1 rounded-full bg-slate-200 text-slate-700'; } return; }
    const data = snap.docs[0].data();
    document.getElementById('evTextUr').value = data.textUr || ''; document.getElementById('evTextEn').value = data.textEn || ''; document.getElementById('evTextHi').value = data.textHi || ''; document.getElementById('evSeconds').value = String(data.seconds || 7);
    if (badge) { badge.textContent = '🟢 Active'; badge.className = 'text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-400'; }
  } catch (err) { console.warn('Event greeting load failed:', err); }
};

window.saveEventGreeting = async function() {
  const ur = document.getElementById('evTextUr').value.trim(); const en = document.getElementById('evTextEn').value.trim(); const hi = document.getElementById('evTextHi').value.trim(); const sec = parseInt(document.getElementById('evSeconds').value) || 7;
  if (!ur && !en && !hi) { alert('Please enter a greeting.'); return; }
  try { await setDoc(doc(db, 'wcf_config', 'event_greeting'), { isEventGreetingConfig: true, active: true, textUr: ur, textEn: en, textHi: hi, seconds: sec, updatedAt: new Date().toISOString(), updatedBy: window.currentAdmin?.email || 'unknown' }); alert('✅ Event greeting saved.'); loadEventGreetingConfig(); } catch (err) { alert('Save failed: ' + err.message); }
};

window.deleteEventGreeting = async function() {
  if (!confirm('Delete event greeting?')) return;
  try { await deleteDoc(doc(db, 'wcf_config', 'event_greeting')); document.getElementById('evTextUr').value = ''; document.getElementById('evTextEn').value = ''; document.getElementById('evTextHi').value = ''; alert('🗑️ Deleted.'); loadEventGreetingConfig(); } catch (err) { alert('Delete failed: ' + err.message); }
};

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

<body class="bg-slate-100 min-h-screen font-sans">

      <div><label class="block text-xs font-bold text-slate-700 mb-1">Password</label><input type="password" id="adminPassword" required class="w-full border rounded-lg px-3 py-2.5 text-sm"></div>

      <button type="submit" class="w-full bg-amber-800 text-white font-bold py-2.5 rounded-xl text-sm">Sign In</button>
    </form>
  </div>
</div>

<div id="dashboard" class="hidden min-h-screen flex flex-col">

    <h1 class="text-base font-bold">WCF Admin Console</h1>
    <div class="flex gap-2 items-center"><span id="currentUserEmail" class="text-xs"></span><button onclick="logoutAdmin()" class="bg-red-700 px-3 py-1.5 rounded text-xs font-bold">Logout</button></div>
  </header>
  
  <main class="max-w-5xl w-full mx-auto p-4 space-y-4 flex-1">
    <div class="bg-white border rounded-xl p-3 flex items-center gap-3 text-xs shadow-sm">
      <span id="dbStatusDot" class="w-3 h-3 rounded-full bg-slate-400"></span>
      <span id="dbStatus" class="font-semibold text-slate-700">Initializing...</span>
      <button onclick="refreshFromCloud()" class="ml-auto bg-emerald-600 text-white px-3 py-1.5 rounded font-bold">Refresh</button>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white border rounded-xl p-4 text-center shadow-sm"><div class="text-[10px] text-slate-500 font-bold uppercase">Families</div><div id="statFamilies" class="text-2xl font-black text-amber-800 mt-1">0</div></div>
      <div class="bg-white border rounded-xl p-4 text-center shadow-sm"><div class="text-[10px] text-slate-500 font-bold uppercase">Individuals</div><div id="statIndividuals" class="text-2xl font-black text-amber-800 mt-1">0</div></div>
      <div class="bg-white border rounded-xl p-4 text-center shadow-sm"><div class="text-[10px] text-slate-500 font-bold uppercase">Pending</div><div id="statPending" class="text-2xl font-black text-red-600 mt-1">0</div></div>
    </div>

    <section class="bg-white border rounded-xl p-4 shadow-sm">
      <h3 class="text-sm font-black text-slate-900 mb-3">⏳ Pending Queue (Approve/Reject)</h3>
      <div id="pendingQueue" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </section>

    <section class="bg-white border rounded-xl p-4 space-y-3 shadow-sm">
      <h3 class="text-sm font-black text-slate-900">📄 Master Directory Export (With Filters)</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
        <select id="filterCountry" class="border rounded-lg p-2 text-xs bg-white"><option value="">-- All Countries --</option><option value="Pakistan">Pakistan</option><option value="India">India</option><option value="Morocco">Morocco</option><option value="Saudi Arabia">Saudi Arabia</option></select>
        <input id="filterCity" type="text" placeholder="City (optional)" class="border rounded-lg p-2 text-xs">
        <select id="filterClan" class="border rounded-lg p-2 text-xs bg-white"><option value="">-- All Clans --</option><option value="Tak">Tak</option><option value="Bhati">Bhati</option><option value="Rao">Rao</option><option value="Molani">Molani</option><option value="Lodha">Lodha</option><option value="Deora">Deora</option><option value="Kukda">Kukda</option><option value="Jinva">Jinva</option><option value="Mangla">Mangla</option><option value="Other">Other</option></select>
      </div>
      <button onclick="exportMasterPDF()" class="w-full bg-amber-700 hover:bg-amber-800 text-white text-xs font-bold py-2.5 rounded-lg shadow">📊 Export Filtered Master Directory</button>
    </section>

    <section class="bg-white border rounded-xl p-4 space-y-3 shadow-sm">
      <h3 class="text-sm font-black text-slate-900">📄 Additional PDF Exports</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        <button onclick="exportPhoneBookPDF()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold py-2.5 rounded-lg">📞 Phone Book</button>
        <button onclick="exportAdultUnmarriedPDF()" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold py-2.5 rounded-lg">💍 18+ Unmarried</button>
        <button onclick="exportNonChhippaWivesPDF()" class="bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold py-2.5 rounded-lg">👩 Non-Chhippa Wives</button>
        <button onclick="exportOtherClansPDF()" class="bg-teal-700 hover:bg-teal-800 text-white text-xs font-bold py-2.5 rounded-lg">📋 Other Clans</button>
        <button onclick="exportJSONBackup()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2.5 rounded-lg md:col-span-2">💾 JSON Backup</button>
      </div>
    </section>

    <section class="bg-white border rounded-xl p-4 space-y-3 shadow-sm">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-black text-slate-900">🎉 Event Greeting Control (event.html)</h3>
        <span id="eventBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-200 text-slate-700">Loading...</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        <input id="evTextUr" type="text" dir="rtl" placeholder="اردو نام یا پیغام..." class="border rounded-lg p-2 text-xs">
        <input id="evTextEn" type="text" dir="ltr" placeholder="English name / greeting..." class="border rounded-lg p-2 text-xs">
        <input id="evTextHi" type="text" dir="ltr" placeholder="हिंदी नाम / संदेश..." class="border rounded-lg p-2 text-xs">
        <select id="evSeconds" class="border rounded-lg p-2 text-xs bg-white"><option value="5">5 seconds</option><option value="7" selected>7 seconds</option><option value="10">10 seconds</option></select>
      </div>
      <div class="flex gap-2">
        <button onclick="saveEventGreeting()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-lg">💾 Save & Publish</button>
        <button onclick="deleteEventGreeting()" class="flex-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-lg">🗑️ Delete</button>
      </div>
    </section>

  </main>
</div>
</body>
</html>
