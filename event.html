<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="ur, en, hi">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title translate="no">تلوار سے قلم تک — خوش آمدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Cinzel:wght@600;800&family=Noto+Sans+Devanagari:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e293b 0%, #090d16 75%, #05070c 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        .lang-bar {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 7px 12px;
            border-radius: 50px;
            border: 1.5px solid rgba(251, 191, 36, 0.5);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 10;
            direction: ltr;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #090d16;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.45);
            transform: scale(1.03);
        }
        .event-card {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.96), rgba(11, 17, 32, 0.99));
            border: 2px solid #fbbf24;
            border-radius: 28px;
            padding: 10px;
            max-width: 470px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 65px rgba(0,0,0,0.85), 0 0 40px rgba(251, 191, 36, 0.22);
            animation: cardEntrance 0.6s ease-out;
        }
        .inner-royal-border {
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 20px;
            padding: 28px 20px 24px 20px;
            position: relative;
        }
        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .heritage-ornament {
            color: #fbbf24;
            font-size: 22px;
            letter-spacing: 6px;
            margin-bottom: 4px;
            opacity: 0.9;
        }
        .calligraphy-title {
            color: #fbbf24;
            text-shadow: 0 4px 18px rgba(251, 191, 36, 0.4);
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(251, 191, 36, 0.28);
        }
        .calligraphy-title.lang-ur {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
            font-size: 40px;
            line-height: 2.25;
            direction: rtl;
        }
        .calligraphy-title.lang-en {
            font-family: 'Cinzel', serif;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1.5px;
            line-height: 1.45;
            direction: ltr;
        }
        .calligraphy-title.lang-hi {
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.6;
            direction: ltr;
        }
        .welcome-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.18);
            border: 1.5px solid #10b981;
            color: #34d399;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .host-highlight {
            color: #fde68a;
            font-weight: 700;
            display: block;
            margin: 10px 0;
            font-size: 1.18em;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
        }
        .greeting-body {
            color: #f8fafc;
            margin-bottom: 26px;
            padding: 0 4px;
        }
        .greeting-body.lang-ur {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 20px;
            line-height: 2.35;
            direction: rtl;
        }
        .greeting-body.lang-en {
            font-family: 'Poppins', sans-serif;
            font-size: 16.5px;
            line-height: 1.75;
            direction: ltr;
        }
        .greeting-body.lang-hi {
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 18px;
            line-height: 1.85;
            direction: ltr;
        }
        .progress-wrapper {
            width: 100%;
            height: 7px;
            background: #090d16;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid rgba(251, 191, 36, 0.25);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fbbf24, #10b981);
            transition: width 0.1s linear;
        }
        .redirect-note {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 14px;
        }
        .skip-btn {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(217, 119, 6, 0.18));
            border: 1.5px solid #fbbf24;
            color: #fde68a;
            padding: 9px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .skip-btn:hover {
            background: #fbbf24;
            color: #090d16;
        }
    </style>
</head>
<body translate="no" class="notranslate">
    <div class="lang-bar notranslate" translate="no">
        <button class="lang-btn active" onclick="setEventLang('ur')" id="btn-ur" translate="no">اردو</button>
        <button class="lang-btn" onclick="setEventLang('en')" id="btn-en" translate="no">English</button>
        <button class="lang-btn" onclick="setEventLang('hi')" id="btn-hi" translate="no">हिंदी</button>
    </div>

    <div class="event-card notranslate" translate="no">
        <div class="inner-royal-border">
            <div class="heritage-ornament">✦ ❖ ✦</div>
            <div id="sloganTitle" class="calligraphy-title lang-ur" translate="no">تلوار سے قلم تک</div>
            <div id="welcomeBadge" class="welcome-badge" translate="no">خوش آمدید!</div>
            <div id="greetingBody" class="greeting-body lang-ur" translate="no"></div>

            <div class="progress-wrapper">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="redirectNote" class="redirect-note" translate="no"></div>
            <button id="skipBtn" class="skip-btn" onclick="goToMainPortal()" translate="no"></button>
        </div>
    </div>

<script>
    const EVENT_HOST_NAME = "";
    const REDIRECT_SECONDS = 7;
    const MAIN_PORTAL_URL = "https://www.worldchhippafoundation.com/";

    let currentLang = 'ur';
    let elapsed = 0;

    const translations = {
        ur: {
            slogan: "تلوار سے قلم تک",
            badge: "خوش آمدید!",
            withHost: (name) => `آپ کا <span class="host-highlight">${name}</span> کی اس شاندار محفل میں خیرمقدم ہے۔<br>آپ ان لاکھوں چھیپا افراد میں سے ہیں جو اپنی نسلوں اور شناخت کو ڈیجیٹل بنا رہے ہیں!`,
            withoutHost: () => `آپ کا اس شاندار محفل میں خیرمقدم ہے۔<br>آپ ان لاکھوں چھیپا افراد میں سے ہیں جو اپنی نسلوں اور شناخت کو ڈیجیٹل بنا رہے ہیں!`,
            redirectText: (sec) => `${sec} سیکنڈ میں مین پورٹل کھل رہا ہے...`,
            skipBtn: "ابھی پورٹل پر جائیں ←"
        },
        en: {
            slogan: "Talwar se Qalam Tak",
            badge: "Welcome!",
            withHost: (name) => `We warmly welcome you to this grand gathering of <span class="host-highlight">${name}</span>.<br>You are among the millions of Chhippa individuals digitizing their generations and identity!`,
            withoutHost: () => `We warmly welcome you to this grand gathering.<br>You are among the millions of Chhippa individuals digitizing their generations and identity!`,
            redirectText: (sec) => `Opening Main Portal in ${sec} seconds...`,
            skipBtn: "Go to Portal Now →"
        },
        hi: {
            slogan: "तलवार से कलम तक",
            badge: "खुशामदीद / स्वागत है!",
            withHost: (name) => `<span class="host-highlight">${name}</span> की इस शानदार महफ़िल में आपका ख़ैरमक़दम है।<br>आप उन लाखों छीपा लोगों में से हैं जो अपनी नस्लों और पहचान को डिजिटल बना रहे हैं!`,
            withoutHost: () => `इस शानदार महफ़िल में आपका ख़ैरमक़दम है।<br>आप उन लाखों छीपा लोगों में से हैं जो अपनी नस्लों और पहचान को डिजिटल बना रहे हैं!`,
            redirectText: (sec) => `${sec} सेकंड में मेन पोर्टल खुल रहा है...`,
            skipBtn: "अभी पोर्टल पर जाएं →"
        }
    };

    function setEventLang(lang) {
        currentLang = lang;
        elapsed = 0;
        document.getElementById('progressBar').style.width = '0%';
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');

        const data = translations[lang];
        const sloganEl = document.getElementById('sloganTitle');
        const badgeEl = document.getElementById('welcomeBadge');
        const bodyEl = document.getElementById('greetingBody');
        const skipEl = document.getElementById('skipBtn');

        sloganEl.className = 'calligraphy-title lang-' + lang;
        sloganEl.innerText = data.slogan;
        badgeEl.innerText = data.badge;

        bodyEl.className = 'greeting-body lang-' + lang;
        const cleanHost = EVENT_HOST_NAME.trim();
        bodyEl.innerHTML = cleanHost.length > 0 ? data.withHost(cleanHost) : data.withoutHost();

        skipEl.innerText = data.skipBtn;
        updateCountdownLabel();
    }

    function updateCountdownLabel() {
        const remaining = Math.max(Math.ceil(REDIRECT_SECONDS - (elapsed / 1000)), 1);
        document.getElementById('redirectNote').innerText = translations[currentLang].redirectText(remaining);
    }

    function goToMainPortal() {
        window.location.href = MAIN_PORTAL_URL;
    }

    setEventLang('ur');

    const intervalStep = 100;
    const totalMs = REDIRECT_SECONDS * 1000;
    const progressBar = document.getElementById('progressBar');

    const timer = setInterval(() => {
        elapsed += intervalStep;
        const percent = Math.min((elapsed / totalMs) * 100, 100);
        progressBar.style.width = percent + '%';
        updateCountdownLabel();

        if (elapsed >= totalMs) {
            clearInterval(timer);
            goToMainPortal();
        }
    }, intervalStep);
</script>
</body>
</html>
