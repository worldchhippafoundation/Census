<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title translate="no">تلوار سے قلم تک — خوش آمدید (Event 1)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Cinzel:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        .bandhani-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('bandhani.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        .event-card {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.96), rgba(11, 17, 32, 0.99));
            border: 2px solid #fbbf24;
            border-radius: 28px;
            padding: 10px;
            max-width: 470px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 65px rgba(0,0,0,0.85), 0 0 40px rgba(251, 191, 36, 0.22);
        }
        .inner-royal-border {
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 20px;
            padding: 28px 20px 24px 20px;
            position: relative;
        }
        .heritage-ornament { color: #fbbf24; font-size: 22px; letter-spacing: 6px; margin-bottom: 4px; opacity: 0.9; }
        .calligraphy-title {
            color: #fbbf24;
            text-shadow: 0 4px 18px rgba(251, 191, 36, 0.4);
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(251, 191, 36, 0.28);
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 32px;
            line-height: 2;
        }
        .welcome-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.18);
            border: 1.5px solid #10b981;
            color: #34d399;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .host-highlight {
            color: #fde68a;
            font-weight: 700;
            display: block;
            margin-top: 15px;
            font-size: 1.15em;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
        }
        .greeting-body { color: #f8fafc; margin-bottom: 26px; padding: 0 4px; font-family: 'Noto Nastaliq Urdu', serif; font-size: 19px; line-height: 2.25; }
        .progress-wrapper {
            width: 100%; height: 7px; background: #090d16; border-radius: 10px;
            overflow: hidden; margin-bottom: 12px; border: 1px solid rgba(251, 191, 36, 0.25);
        }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #10b981); transition: width 0.1s linear; }
        .redirect-note { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; }
        .skip-btn {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(217, 119, 6, 0.18));
            border: 1.5px solid #fbbf24; color: #fde68a; padding: 9px 24px;
            border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body translate="no" class="notranslate bandhani-bg">
    <div class="event-card notranslate" translate="no">
        <div class="inner-royal-border">
            <div class="heritage-ornament">✦ ❖ ✦</div>
            <div id="eventTitle" class="calligraphy-title" translate="no">تلوار سے قلم تک</div>
            <div id="welcomeBadge" class="welcome-badge" translate="no">خوش آمدید!</div>
            <div id="greetingBody" class="greeting-body" translate="no"></div>
            <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>
            <div id="redirectNote" class="redirect-note" translate="no"></div>
            <button id="skipBtn" class="skip-btn" onclick="goToMainPortal()" translate="no">ابھی پورٹل پر جائیں ←</button>
        </div>
    </div>
<script>
    var MAIN_PORTAL_URL = "https://www.worldchhippafoundation.com/";
    var redirectSeconds = 7;
    var elapsed = 0;
    var timerRef = null;
    var liveEventConfig = { active: false, eventName: "", greeting: "", hostName: "" };

    function escapeSafe(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderEventUI() {
        var titleEl = document.getElementById("eventTitle");
        var bodyEl = document.getElementById("greetingBody");
        var defaultGreeting = "آپ کا اس شاندار محفل میں خیرمقدم ہے۔ آپ ان لاکھوں چھیپا افراد میں سے ہیں جو اپنی نسلوں اور شناخت کو ڈیجیٹل بنا رہے ہیں!";

        if (liveEventConfig && liveEventConfig.active && (liveEventConfig.eventName || liveEventConfig.greeting || liveEventConfig.hostName)) {
            if (liveEventConfig.eventName) {
                titleEl.innerText = liveEventConfig.eventName;
                titleEl.style.display = "block";
            } else {
                titleEl.innerText = "تلوار سے قلم تک";
            }

            var htmlContent = "";
            if (liveEventConfig.greeting) {
                htmlContent += "<div>" + escapeSafe(liveEventConfig.greeting).replace(/\n/g, "<br>") + "</div>";
            } else {
                htmlContent += "<div>" + defaultGreeting + "</div>";
            }

            if (liveEventConfig.hostName) {
                htmlContent += "<div class='host-highlight'>" + escapeSafe(liveEventConfig.hostName) + "</div>";
            }
            bodyEl.innerHTML = htmlContent;
        } else {
            titleEl.innerText = "تلوار سے قلم تک";
            bodyEl.innerHTML = "<div>" + defaultGreeting + "</div>";
        }
        updateCountdownLabel();
    }

    function updateCountdownLabel() {
        var remaining = Math.max(Math.ceil(redirectSeconds - (elapsed / 1000)), 1);
        document.getElementById("redirectNote").innerText = remaining + " سیکنڈ میں مین پورٹل کھل رہا ہے...";
    }

    function goToMainPortal() {
        window.location.href = MAIN_PORTAL_URL;
    }

    function startRedirectCountdown() {
        if (timerRef) clearInterval(timerRef);
        elapsed = 0;
        var intervalStep = 100;
        var progressBar = document.getElementById("progressBar");
        timerRef = setInterval(function() {
            var totalMs = redirectSeconds * 1000;
            elapsed += intervalStep;
            var percent = Math.min((elapsed / totalMs) * 100, 100);
            progressBar.style.width = percent + "%";
            updateCountdownLabel();
            if (elapsed >= totalMs) {
                clearInterval(timerRef);
                goToMainPortal();
            }
        }, intervalStep);
    }

    async function fetchLiveGreetingFromAdminCloud() {
        try {
            var firebaseConfig = {
                apiKey: atob("QUl6YVN5RG5oeTI4SUd6Zl94TFVMWUJKdWlPOUhIUnowbEloZ0dB"),
                authDomain: atob("Y2hpcHBhLWNlbnN1cy5maXJlYmFzZWFwcC5jb20="),
                projectId: atob("Y2hpcHBhLWNlbnN1cw=="),
                storageBucket: atob("Y2hpcHBhLWNlbnN1cy5maXJlYmFzZXN0b3JhZ2UuYXBw"),
                messagingSenderId: atob("Mjg1OTQ5Mzk5NTU3"),
                appId: atob("MToyODU5NDkzOTk1NTc6d2ViOjQ1YmRiNWZmMjg4ZmRlY2RkMzAyNmM=")
            };
            if (typeof firebase !== "undefined") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                var db = firebase.firestore();
                var docRef = db.collection("wcf_pending_queue").doc("WCF_LIVE_EVENT1_CONFIG");
                var snap = await docRef.get({ source: "server" }).catch(function() { return docRef.get(); });
                if (snap && snap.exists) {
                    var d = snap.data() || {};
                    if (d.active) {
                        liveEventConfig = d;
                        if (d.seconds && Number(d.seconds) >= 3) redirectSeconds = Number(d.seconds);
                    }
                }
            }
        } catch (e) {
            console.warn("Event cloud fetch fallback:", e);
        }
        renderEventUI();
        startRedirectCountdown();
    }

    renderEventUI();
    fetchLiveGreetingFromAdminCloud();
</script>
</body>
</html>
