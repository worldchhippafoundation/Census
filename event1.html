
<!DOCTYPE html>
<html lang="ur" dir="rtl" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title translate="no">تلوار سے قلم تک — خوش آمدید</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Cinzel:wght@600;800&family=Noto+Sans+Devanagari:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        .bandhani-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.75)), url('bandhani.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }
        .lang-bar {
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            padding: 7px 12px;
            border-radius: 50px;
            border: 1.5px solid rgba(251, 191, 36, 0.5);
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 10;
            direction: ltr;
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #090d16;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.45);
            transform: scale(1.03);
        }
        .event-card {
            background: linear-gradient(165deg, rgba(30, 41, 59, 0.96), rgba(11, 17, 32, 0.99));
            border: 2px solid #fbbf24;
            border-radius: 28px;
            padding: 10px;
            max-width: 470px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 65px rgba(0,0,0,0.85), 0 0 40px rgba(251, 191, 36, 0.22);
        }
        .inner-royal-border {
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 20px;
            padding: 28px 20px 24px 20px;
            position: relative;
        }
        .heritage-ornament { color: #fbbf24; font-size: 22px; letter-spacing: 6px; margin-bottom: 4px; opacity: 0.9; }
        .calligraphy-title {
            color: #fbbf24;
            text-shadow: 0 4px 18px rgba(251, 191, 36, 0.4);
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(251, 191, 36, 0.28);
        }
        .calligraphy-title.lang-ur { font-family: 'Noto Nastaliq Urdu', serif; font-size: 40px; line-height: 2.25; direction: rtl; }
        .calligraphy-title.lang-en { font-family: 'Cinzel', serif; font-size: 27px; font-weight: 800; letter-spacing: 1.5px; line-height: 1.45; direction: ltr; }
        .calligraphy-title.lang-hi { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.6; direction: ltr; }
        .welcome-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.18);
            border: 1.5px solid #10b981;
            color: #34d399;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .host-highlight {
            color: #fde68a;
            font-weight: 700;
            display: block;
            margin: 10px 0;
            font-size: 1.18em;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.3);
        }
        .greeting-body { color: #f8fafc; margin-bottom: 26px; padding: 0 4px; }
        .greeting-body.lang-ur { font-family: 'Noto Nastaliq Urdu', serif; font-size: 20px; line-height: 2.35; direction: rtl; }
        .greeting-body.lang-en { font-family: 'Poppins', sans-serif; font-size: 16.5px; line-height: 1.75; direction: ltr; }
        .greeting-body.lang-hi { font-family: 'Noto Sans Devanagari', sans-serif; font-size: 18px; line-height: 1.85; direction: ltr; }
        .progress-wrapper {
            width: 100%; height: 7px; background: #090d16; border-radius: 10px;
            overflow: hidden; margin-bottom: 12px; border: 1px solid rgba(251, 191, 36, 0.25);
        }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #fbbf24, #10b981); transition: width 0.1s linear; }
        .redirect-note { font-size: 13px; color: #cbd5e1; margin-bottom: 14px; }
        .skip-btn {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.18), rgba(217, 119, 6, 0.18));
            border: 1.5px solid #fbbf24; color: #fde68a; padding: 9px 24px;
            border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body translate="no" class="notranslate bandhani-bg">
    <div class="lang-bar notranslate" translate="no">
        <button class="lang-btn active" onclick="setEventLang('ur')" id="btn-ur" translate="no">اردو</button>
        <button class="lang-btn" onclick="setEventLang('en')" id="btn-en" translate="no">English</button>
        <button class="lang-btn" onclick="setEventLang('hi')" id="btn-hi" translate="no">हिंदी</button>
    </div>
    <div class="event-card notranslate" translate="no">
        <div class="inner-royal-border">
            <div class="heritage-ornament">✦ ❖ ✦</div>
            <div id="sloganTitle" class="calligraphy-title lang-ur" translate="no">تلوار سے قلم تک</div>
            <div id="welcomeBadge" class="welcome-badge" translate="no">خوش آمدید!</div>
            <div id="greetingBody" class="greeting-body lang-ur" translate="no"></div>
            <div class="progress-wrapper"><div id="progressBar" class="progress-bar"></div></div>
            <div id="redirectNote" class="redirect-note" translate="no"></div>
            <button id="skipBtn" class="skip-btn" onclick="goToMainPortal()" translate="no"></button>
        </div>
    </div>
<script>
    var MAIN_PORTAL_URL = "https://www.worldchhippafoundation.com/";
    var redirectSeconds = 7;
    var currentLang = "ur";
    var elapsed = 0;
    var timerRef = null;
    var userManuallySwitchedLang = false;
    var liveEventConfig = { active: false, mode: "host", textUr: "", textEn: "", textHi: "" };

    function escapeSafe(s) {
        return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    var translations = {
        ur: {
            slogan: "تلوار سے قلم تک",
            badge: "خوش آمدید!",
            withHost: function(name) { return "آپ کا <span class=\"host-highlight\">" + escapeSafe(name) + "</span> کی اس شاندار محفل میں خیرمقدم ہے۔<br>آپ ان لاکھوں چھیپا افراد میں سے ہیں جو اپنی نسلوں اور شناخت کو ڈیجیٹل بنا رہے ہیں!"; },
            withoutHost: function() { return "آپ کا اس شاندار محفل میں خیرمقدم ہے۔<br>آپ ان لاکھوں چھیپا افراد میں سے ہیں جو اپنی نسلوں اور شناخت کو ڈیجیٹل بنا رہے ہیں!"; },
            redirectText: function(sec) { return sec + " سیکنڈ میں مین پورٹل کھل رہا ہے..."; },
            skipBtn: "ابھی پورٹل پر جائیں ←"
        },
        en: {
            slogan: "Talwar se Qalam Tak",
            badge: "Welcome!",
            withHost: function(name) { return "We warmly welcome you to this grand gathering of <span class=\"host-highlight\">" + escapeSafe(name) + "</span>.<br>You are among the millions of Chhippa individuals digitizing their generations and identity!"; },
            withoutHost: function() { return "We warmly welcome you to this grand gathering.<br>You are among the millions of Chhippa individuals digitizing their generations and identity!"; },
            redirectText: function(sec) { return "Opening Main Portal in " + sec + " seconds..."; },
            skipBtn: "Go to Portal Now →"
        },
        hi: {
            slogan: "तलवार से कलम तक",
            badge: "खुशामदीद / स्वागत है!",
            withHost: function(name) { return "<span class=\"host-highlight\">" + escapeSafe(name) + "</span> की इस शानदार महफ़िल में आपका ख़ैरमक़दम है।<br>आप उन लाखों छीपा लोगों में से हैं जो अपनी नस्लों और पहचान को डिजिटल बना रहे हैं!"; },
            withoutHost: function() { return "इस शानदार महफ़िल में आपका ख़ैरमक़दम है।<br>आप उन लाखों छीपा लोगों में से हैं जो अपनी नस्लों और पहचान को डिजिटल बना रहे हैं!"; },
            redirectText: function(sec) { return sec + " सेकंड में मेन पोर्टल खुल रहा है..."; },
            skipBtn: "अभी पोर्टल पर जाएं →"
        }
    };

    function getActiveLangGreetingText(lang) {
        if (!liveEventConfig || !liveEventConfig.active) return "";
        if (lang === "ur") return liveEventConfig.textUr || liveEventConfig.textEn || liveEventConfig.textHi || "";
        if (lang === "en") return liveEventConfig.textEn || liveEventConfig.textUr || liveEventConfig.textHi || "";
        if (lang === "hi") return liveEventConfig.textHi || liveEventConfig.textUr || liveEventConfig.textEn || "";
        return "";
    }

    function applyLangButtonsUI(lang) {
        ["ur", "en", "hi"].forEach(function(k) {
            var btn = document.getElementById("btn-" + k);
            if (btn) btn.classList.toggle("active", k === lang);
        });
    }

    function renderCurrentLanguageUI() {
        var data = translations[currentLang];
        var sloganEl = document.getElementById("sloganTitle");
        var badgeEl = document.getElementById("welcomeBadge");
        var bodyEl = document.getElementById("greetingBody");
        var skipEl = document.getElementById("skipBtn");

        sloganEl.className = "calligraphy-title lang-" + currentLang;
        sloganEl.innerText = data.slogan;
        badgeEl.innerText = data.badge;
        bodyEl.className = "greeting-body lang-" + currentLang;

        var liveTxt = getActiveLangGreetingText(currentLang).trim();
        if (liveTxt.length > 0) {
            if (liveEventConfig.mode === "custom") {
                bodyEl.innerHTML = escapeSafe(liveTxt).replace(/\n/g, "<br>");
            } else {
                bodyEl.innerHTML = data.withHost(liveTxt);
            }
        } else {
            bodyEl.innerHTML = data.withoutHost();
        }
        skipEl.innerText = data.skipBtn;
        updateCountdownLabel();
    }

    function setEventLang(lang) {
        userManuallySwitchedLang = true;
        currentLang = lang;
        elapsed = 0;
        document.getElementById("progressBar").style.width = "0%";
        applyLangButtonsUI(lang);
        renderCurrentLanguageUI();
    }

    function updateCountdownLabel() {
        var remaining = Math.max(Math.ceil(redirectSeconds - (elapsed / 1000)), 1);
        document.getElementById("redirectNote").innerText = translations[currentLang].redirectText(remaining);
    }

    function goToMainPortal() {
        window.location.href = MAIN_PORTAL_URL;
    }

    function startRedirectCountdown() {
        if (timerRef) clearInterval(timerRef);
        elapsed = 0;
        var intervalStep = 100;
        var progressBar = document.getElementById("progressBar");
        timerRef = setInterval(function() {
            var totalMs = redirectSeconds * 1000;
            elapsed += intervalStep;
            var percent = Math.min((elapsed / totalMs) * 100, 100);
            progressBar.style.width = percent + "%";
            updateCountdownLabel();
            if (elapsed >= totalMs) {
                clearInterval(timerRef);
                goToMainPortal();
            }
        }, intervalStep);
    }

    async function fetchLiveGreetingFromAdminCloud() {
        try {
            var firebaseConfig = {
                apiKey: atob("QUl6YVN5RG5oeTI4SUd6Zl94TFVMWUJKdWlPOUhIUnowbEloZ0dB"),
                authDomain: atob("Y2hpcHBhLWNlbnN1cy5maXJlYmFzZWFwcC5jb20="),
                projectId: atob("Y2hpcHBhLWNlbnN1cw=="),
                storageBucket: atob("Y2hpcHBhLWNlbnN1cy5maXJlYmFzZXN0b3JhZ2UuYXBw"),
                messagingSenderId: atob("Mjg1OTQ5Mzk5NTU3"),
                appId: atob("MToyODU5NDkzOTk1NTc6d2ViOjQ1YmRiNWZmMjg4ZmRlY2RkMzAyNmM=")
            };
            if (typeof firebase !== "undefined") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                var db = firebase.firestore();
                var docRef = db.collection("wcf_config").doc("WCF_LIVE_EVENT_CONFIG");
                var snap = await docRef.get({ source: "server" }).catch(function() { return docRef.get(); });
                if (snap && snap.exists) {
                    var d = snap.data() || {};
                    if (d.active && (d.textUr || d.textEn || d.textHi)) {
                        liveEventConfig = d;
                        if (d.seconds && Number(d.seconds) >= 3) redirectSeconds = Number(d.seconds);

                        if (!userManuallySwitchedLang) {
                            if (!d.textUr && d.textEn) {
                                currentLang = "en";
                                applyLangButtonsUI("en");
                            } else if (!d.textUr && !d.textEn && d.textHi) {
                                currentLang = "hi";
                                applyLangButtonsUI("hi");
                            }
                        }
                    }
                }
            }
        } catch (e) {
            console.warn("Event cloud fetch fallback:", e);
        }
        renderCurrentLanguageUI();
        startRedirectCountdown();
    }

    renderCurrentLanguageUI();
    fetchLiveGreetingFromAdminCloud();
</script>
</body>
</html>
